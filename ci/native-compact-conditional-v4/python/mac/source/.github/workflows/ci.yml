name: Offline Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B scripts/test_all.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B verification/check_handshake_schema.py
