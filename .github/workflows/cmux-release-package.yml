name: cmux local Release package
on:
  push:
    branches: [ccc/cmux-release-package-20261110-r3]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cmux-release-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-new-package-acceptance:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout the exact preparation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: preparation
          persist-credentials: false
      - name: Check fixed source prerequisites without app consumption
        run: >-
          python3 -BE preparation/integrations/cmux-release-package/release_build.py
          --source "$GITHUB_WORKSPACE/cmux-source"
          --output "$RUNNER_TEMP/cmux-release-package-r3/build"
      - name: Checkout the accepted source base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: manaflow-ai/cmux
          ref: 2e109a1739d320fe36220afb3e7775b59c1acd47
          submodules: recursive
          fetch-depth: 1
          path: cmux-source
          persist-credentials: false
      - name: Set up the original Release Bun dependency
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Set up the original Release Go dependency
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.x"
          cache: false
      - name: One Release app-only build and one new package acceptance
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -BE preparation/integrations/cmux-release-package/ci_release.py
          --source "$GITHUB_WORKSPACE/cmux-source"
          --output "$RUNNER_TEMP/cmux-release-package-r3"
      - name: Admit the immutable App archive for retention
        id: archive
        if: always() && steps.pipeline.outcome != 'skipped'
        run: >-
          python3 -BE preparation/integrations/cmux-release-package/evidence_release.py
          --attempt "$RUNNER_TEMP/cmux-release-package-r3" --check-app-upload
      - name: Retain full App separately on GitHub
        id: app
        if: always() && steps.archive.outputs.ready == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cmux-release-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-release-package-r3/package/cmux-release.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Bind actual App upload and export bounded exact evidence
        if: always() && steps.pipeline.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_ARTIFACT_ID: ${{ steps.app.outputs.artifact-id }}
          RELEASE_APP_ARTIFACT_DIGEST: ${{ steps.app.outputs.artifact-digest }}
          RELEASE_APP_ARTIFACT_URL: ${{ steps.app.outputs.artifact-url }}
        run: >-
          python3 -BE preparation/integrations/cmux-release-package/evidence_release.py
          --attempt "$RUNNER_TEMP/cmux-release-package-r3"
          --output "$RUNNER_TEMP/cmux-release-evidence-r3"
      - name: Retain small evidence independently of the full App
        if: always() && steps.pipeline.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: cmux-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-release-evidence-r3
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
