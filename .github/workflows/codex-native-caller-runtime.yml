name: Native caller real ToolCtx fixture

on:
  push:
    branches: [ccc/native-caller-toolctx-20261109-r2]
    paths:
      - .github/workflows/codex-native-caller-runtime.yml
      - integrations/native-caller-runtime/**

permissions:
  contents: read
  actions: read

concurrency:
  group: native-caller-toolctx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  caller-runtime-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: ccc
          persist-credentials: false
      - name: Admit exact successful artifacts and run one private ToolCtx fixture
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_RUNTIME_CONTRACT_SHA256: ac34ceb27a34644741e3378e731f8daee08fceb7643d933ac48233e9c42f6233
        run: >-
          python3 -BE ccc/integrations/native-caller-runtime/runner.py
          --contract "$GITHUB_WORKSPACE/ccc/integrations/native-caller-runtime/CONTRACT.json"
          --contract-sha256 "$CALLER_RUNTIME_CONTRACT_SHA256"
          --root "$RUNNER_TEMP/ct"
      - name: Preserve bounded fixture evidence including refusals
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-caller-toolctx-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ct/*.json
            ${{ runner.temp }}/ct/a/*.json
            ${{ runner.temp }}/ct/f/*.json
            ${{ runner.temp }}/ct/f/*.jsonl
            ${{ runner.temp }}/ct/f/n/sessions/**/*.jsonl
            ${{ runner.temp }}/ct/f/PTY.bin
          if-no-files-found: warn
          retention-days: 14
