name: Isolated official Nightly artifact admission

on:
  push:
    branches: [ccc/nightly-artifact-admission-20261105]
    paths:
      - .github/workflows/nightly-artifact-admission.yml
      - integrations/nightly-artifact-admission/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-artifact-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticate-official-app:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
      - name: Verify exact reviewed scripts and offline negative controls
        run: |
          python3 -BE - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('integrations/nightly-artifact-admission')
          pins = {
              'admit_nightly.py': 'f65a1f0704553f83eab05c08d20f44985221547678081555aba876b44d58b4db',
              'test_admit_nightly.py': 'd9a7a33610a4d36f3ab9f2fd472b7b816815677373ed437a25abcb5645ca1b8b',
          }
          for name, expected in pins.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
          python3 -BE integrations/nightly-artifact-admission/test_admit_nightly.py
      - name: Download and authenticate official immutable app without launching
        run: >-
          python3 -BE integrations/nightly-artifact-admission/admit_nightly.py
          --output "$RUNNER_TEMP/ccc-nightly-artifact-admission"
      - name: Preserve actual admission evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: official-nightly-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ccc-nightly-artifact-admission/*.json
            ${{ runner.temp }}/ccc-nightly-artifact-admission/*.txt
            ${{ runner.temp }}/ccc-nightly-artifact-admission/*.plist
          if-no-files-found: warn
          retention-days: 14
