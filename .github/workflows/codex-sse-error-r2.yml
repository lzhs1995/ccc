name: Codex SSE error R2 source validation

on:
  push:
    branches: [ci/codex-sse-error-20261112]
    paths:
      - .github/workflows/codex-sse-error-r2.yml
      - integrations/codex-sse-error-r2/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-sse-error-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-source-validation:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: "none"
      CARGO_PROFILE_TEST_DEBUG: "none"
      RUST_MIN_STACK: "8388608"
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 6aaac694803004a63c6f393d153c96d22521a6b9
          path: codex
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - name: Verify exact clean source and unchanged dependency lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sse-evidence"
          rustc --version | tee "$RUNNER_TEMP/sse-evidence/rustc.txt"
          python3 validation/integrations/codex-sse-error-r2/verify.py initialize --source codex --evidence "$RUNNER_TEMP/sse-evidence"
          python3 validation/integrations/codex-sse-error-r2/verify.py apply-red --source codex
      - name: Prove the original parser fails the exact regression
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked --profile dev-small -p codex-api --lib sse::responses::error_delivery_regression_tests::named_writer_error_is_delivered_before_idle_without_eof -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/baseline-red.log"
          result=${PIPESTATUS[0]}
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind baseline-red --log "$RUNNER_TEMP/sse-evidence/baseline-red.log" --returncode "$result"
      - name: Apply the frozen candidate and identical regression
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/integrations/codex-sse-error-r2/verify.py remove-red --source codex
          python3 validation/integrations/codex-sse-error-r2/verify.py apply-candidate --source codex
          python3 validation/integrations/codex-sse-error-r2/verify.py apply-red --source codex
      - name: Run all eight exact fixtures
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked --profile dev-small -p codex-api --lib sse::responses::structured_error_tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/eight-fixtures.log"
          result=${PIPESTATUS[0]}
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind targeted --log "$RUNNER_TEMP/sse-evidence/eight-fixtures.log" --returncode "$result"
      - name: Require the original regression to turn green
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked --profile dev-small -p codex-api --lib sse::responses::error_delivery_regression_tests::named_writer_error_is_delivered_before_idle_without_eof -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/candidate-red.log"
          result=${PIPESTATUS[0]}
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind candidate-red --log "$RUNNER_TEMP/sse-evidence/candidate-red.log" --returncode "$result"
      - name: Existing SSE and HTTP bridge regressions
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          for filter in sse::responses api_bridge::; do
            label=${filter//:/_}
            cargo test --locked --profile dev-small -p codex-api --lib "$filter" -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/$label.log"
            result=${PIPESTATUS[0]}
            python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind related --log "$RUNNER_TEMP/sse-evidence/$label.log" --returncode "$result" || exit 1
          done
      - name: Existing protocol errors and debug telemetry regressions
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked --profile dev-small -p codex-protocol --lib error::tests -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/protocol-errors.log"
          result=${PIPESTATUS[0]}
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind related --log "$RUNNER_TEMP/sse-evidence/protocol-errors.log" --returncode "$result" || exit 1
          cargo test --locked --profile dev-small -p codex-response-debug-context --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sse-evidence/debug-context.log"
          result=${PIPESTATUS[0]}
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py log --kind related --log "$RUNNER_TEMP/sse-evidence/debug-context.log" --returncode "$result"
      - name: Typecheck sibling API error consumers
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --profile dev-small -p codex-guardian-v2 -p codex-cli --lib 2>&1 | tee "$RUNNER_TEMP/sse-evidence/sibling-consumers.log"
          cargo check --locked --profile dev-small -p codex-cli --bin codex 2>&1 | tee "$RUNNER_TEMP/sse-evidence/cli-doctor.log"
      - name: Verify no dependency upgrades
        if: always()
        run: python3 validation/integrations/codex-sse-error-r2/verify.py graph --source codex
      - name: Save formatting check separately without altering source
        if: always()
        working-directory: codex/codex-rs
        shell: bash
        run: |
          set -uo pipefail
          git diff --binary > "$RUNNER_TEMP/sse-evidence/source-before-format.patch"
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py snapshot --source .. --log "$RUNNER_TEMP/sse-evidence/source-before-format.json" || exit 1
          cargo fmt -- --config imports_granularity=Item --check > "$RUNNER_TEMP/sse-evidence/format.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/sse-evidence/format.exit"
          git diff --binary > "$RUNNER_TEMP/sse-evidence/source-after-format.patch"
          python3 ../../validation/integrations/codex-sse-error-r2/verify.py snapshot --source .. --log "$RUNNER_TEMP/sse-evidence/source-after-format.json" || exit 1
          cmp "$RUNNER_TEMP/sse-evidence/source-before-format.patch" "$RUNNER_TEMP/sse-evidence/source-after-format.patch" || exit 1
          cmp "$RUNNER_TEMP/sse-evidence/source-before-format.json" "$RUNNER_TEMP/sse-evidence/source-after-format.json" || exit 1
          exit "$result"
      - name: Preserve original compiler and test evidence including failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-sse-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sse-evidence/
          if-no-files-found: error
          retention-days: 14
