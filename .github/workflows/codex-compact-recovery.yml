name: Isolated Codex compact recovery candidate

on:
  push:
    branches: [ccc/compact-goal-recovery-20261105-r9]
    paths:
      - .github/workflows/codex-compact-recovery.yml
      - integrations/compact-recovery-build/**
      - '!integrations/compact-recovery-build/README.md'
  workflow_dispatch:
    inputs:
      freeze_sha256:
        description: SHA256 of the reviewed complete freeze.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-compact-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-macos:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "none"
      CARGO_PROFILE_TEST_DEBUG: "none"
      CARGO_PROFILE_RELEASE_DEBUG: "none"
      CARGO_BUILD_JOBS: "3"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      INSTA_UPDATE: "no"
      STABLE_GIT_COMMIT: 6aaac694803004a63c6f393d153c96d22521a6b9
      FREEZE_SHA256: ${{ inputs.freeze_sha256 || 'ac04b248df2eee7ae8f73a6f873b7053610fa2bc639c0779729cac344f2db194' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: ccc
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: lzhs1995/ccc
          ref: a0f7fa7216673009375405ca99ca5c0a4b8a997f
          path: ccc-base
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 6aaac694803004a63c6f393d153c96d22521a6b9
          path: codex
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103
      - name: Verify preparation and official V8 download failure controls
        run: |
          python3 -BE ccc/integrations/compact-recovery-build/test_preparation.py
          python3 -BE ccc/integrations/compact-recovery-build/test_v8_preparation.py
          python3 -BE ccc/integrations/compact-recovery-build/test_merge_contract.py
      - name: Verify source, run fresh tests, build and export actual schema
        run: >-
          python3 ccc/integrations/compact-recovery-build/ci.py
          --ccc ccc-base --codex codex
          --freeze ccc/integrations/compact-recovery-build/freeze.json
          --freeze-sha256 "$FREEZE_SHA256"
          --output "$RUNNER_TEMP/compact-recovery-evidence"
      - name: Preserve fresh build and test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-compact-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compact-recovery-evidence/*.json
            ${{ runner.temp }}/compact-recovery-evidence/*.log
            ${{ runner.temp }}/compact-recovery-evidence/*.xml
            ${{ runner.temp }}/compact-recovery-evidence/*.toml
            ${{ runner.temp }}/compact-recovery-evidence/*Cargo.lock
            ${{ runner.temp }}/compact-recovery-evidence/generated-schema/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve immutable candidate binary (no installation)
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-compact-recovery-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-recovery-evidence/package/
          if-no-files-found: error
          retention-days: 14
